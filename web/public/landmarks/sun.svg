<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" fill="none">
  <!-- Pop desert sun with halftone shading. -->
  <defs>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.7" fill="#f5232b"/>
    </pattern>
  </defs>
  <g stroke="#141118" stroke-width="3" stroke-linecap="round">
    <g>
      <line x1="110" y1="8" x2="110" y2="34"/>
      <line x1="110" y1="186" x2="110" y2="212"/>
      <line x1="8" y1="110" x2="34" y2="110"/>
      <line x1="186" y1="110" x2="212" y2="110"/>
      <line x1="38" y1="38" x2="56" y2="56"/>
      <line x1="164" y1="164" x2="182" y2="182"/>
      <line x1="182" y1="38" x2="164" y2="56"/>
      <line x1="56" y1="164" x2="38" y2="182"/>
    </g>
    <circle cx="110" cy="110" r="70" fill="#ffd21e"/>
    <circle cx="110" cy="110" r="70" fill="url(#dots)" opacity="0.55"/>
  </g>
</svg>
