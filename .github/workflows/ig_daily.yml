name: ig-daily

# Daily "Today in El Paso" Instagram carousel.
#
#   build    renders slides and files a draft for review in /admin/ig
#   publish  ships anything a human has approved
#
# The build is chained to the scrape via workflow_run rather than its own cron:
# a fixed offset would only be a hope, since Actions cron routinely drifts
# 10-20 minutes and the scrape itself can take up to 20.
on:
  workflow_run:
    workflows: ["scheduled-scrape"]
    types: [completed]
  schedule:
    # Publish sweep across El Paso daytime. The window MUST straddle midnight
    # UTC: the 17:00-local deadline is 23:00 UTC in MDT but 00:00 UTC the NEXT
    # DAY in MST, so a window ending at 23:59 covers the summer and silently
    # misses every winter post — the sweep would not run again until 14:00 UTC
    # the following morning, by which point _publish_one's staleness guard
    # expires the row unpublished. 13-23,0-2 covers 06:00-19:00 MST and
    # 07:00-20:00 MDT, with slack at both ends for Actions cron drift.
    - cron: "0,30 13-23,0-2 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        default: "both"
        type: choice
        options: ["both", "build", "publish", "prune"]

# Never let two runs publish concurrently. The CAS claim in the publisher is the
# real guard; this just avoids the wasted work of racing to it.
concurrency:
  group: ig-daily
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
  IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
  META_APP_ID: ${{ secrets.META_APP_ID }}
  META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
  IG_AUTOPOST: ${{ vars.IG_AUTOPOST }}
  IG_SLIDES_BUCKET: ${{ vars.IG_SLIDES_BUCKET }}
  IG_MIN_SLIDES: ${{ vars.IG_MIN_SLIDES }}
  IG_MAX_SLIDES: ${{ vars.IG_MAX_SLIDES }}
  IG_HANDLE: ${{ vars.IG_HANDLE }}
  IG_TIMEZONE: ${{ vars.IG_TIMEZONE }}
  IG_SUGGESTED_PUBLISH_HOUR: ${{ vars.IG_SUGGESTED_PUBLISH_HOUR }}
  IG_SLIDE_RETENTION_DAYS: ${{ vars.IG_SLIDE_RETENTION_DAYS }}
  IG_DIGEST_SLOTS: ${{ vars.IG_DIGEST_SLOTS }}
  # Opt-out posting: a draft nobody touched by IG_AUTO_APPROVE_HOUR ships by
  # itself. Off unless the repo variable says otherwise.
  IG_AUTO_APPROVE: ${{ vars.IG_AUTO_APPROVE }}
  IG_AUTO_APPROVE_HOUR: ${{ vars.IG_AUTO_APPROVE_HOUR }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
  NOTIFY_ADMIN_EMAIL: ${{ secrets.NOTIFY_ADMIN_EMAIL }}
  IG_NOTIFY_SECRET: ${{ secrets.IG_NOTIFY_SECRET }}
  NOTIFY_EMAIL_FROM: ${{ vars.NOTIFY_EMAIL_FROM }}
  IG_NOTIFY_TTL_HOURS: ${{ vars.IG_NOTIFY_TTL_HOURS }}
  SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}

jobs:
  # Deliberately NOT a dependency of `build`: a broken notification channel
  # must not stop today's draft being made. This job exists to be loud, because
  # every send in this pipeline is best-effort by design and a dead bot is
  # otherwise indistinguishable from a quiet week. check-telegram exits non-zero
  # on an unhealthy webhook, which makes GitHub email the owner — the one alert
  # path that does not depend on Telegram working.
  preflight:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.job != 'prune'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[social]"
      - name: Check Telegram webhook health
        run: python -m scraper.social check-telegram
      - name: Check IG token expiry
        run: python -m scraper.social check-token

  build:
    # Only after a scrape (so we render the freshest data), or on demand.
    if: >-
      github.event_name == 'workflow_dispatch' && github.event.inputs.job != 'publish' ||
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[social]"

      # Long-lived Meta tokens last ~60 days and nothing in CI can rotate a
      # repo secret on its own, so an expiring (or already-dead) token is
      # checked loudly here rather than discovered as a mystery 400 two
      # weeks later. continue-on-error: a dead token still shouldn't stop
      # today's draft from being built for review — the human reviewing it
      # in Telegram sees the same alert this step already sent, and can fix
      # the token before the scheduled publish sweep actually needs it.
      - name: Check token expiry
        run: python -m scraper.social check-token
        continue-on-error: true

      - name: Prune old slides
        run: python -m scraper.social prune

      - name: Build carousel
        run: python -m scraper.social build

  publish:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' && github.event.inputs.job != 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[social]"
      # Opt-out posting. Runs in this job rather than on its own 17:00 cron so
      # a post crossing its deadline ships in the SAME sweep instead of up to
      # 30 minutes later, and so there is no second schedule to keep
      # DST-correct. A no-op while IG_AUTO_APPROVE is unset.
      - name: Auto-approve drafts past their deadline
        run: python -m scraper.social autoapprove

      - name: Publish approved carousel
        run: python -m scraper.social publish

      # Snapshot how already-published posts did. Driven by "published long
      # enough ago AND missing this window" rather than by cron precision, so
      # it is idempotent and a skipped run backfills on the next sweep. Never
      # fatal: a Meta insights outage must not fail a publish that worked.
      - name: Collect post metrics
        continue-on-error: true
        run: python -m scraper.social metrics
