<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 200" fill="none">
  <!-- Paso del Norte / Santa Fe international bridge — the port of entry. -->
  <!-- deck -->
  <rect x="0" y="120" width="460" height="20" fill="#8a8f98" stroke="#141118" stroke-width="3"/>
  <!-- arch trusses -->
  <g stroke="#141118" stroke-width="3" fill="none">
    <path d="M20 120 Q115 34 210 120" stroke-width="4"/>
    <path d="M250 120 Q345 34 440 120" stroke-width="4"/>
    <!-- hangers -->
    <line x1="60" y1="86" x2="60" y2="120"/><line x1="100" y1="66" x2="100" y2="120"/>
    <line x1="140" y1="60" x2="140" y2="120"/><line x1="180" y1="72" x2="180" y2="120"/>
    <line x1="290" y1="86" x2="290" y2="120"/><line x1="330" y1="66" x2="330" y2="120"/>
    <line x1="370" y1="60" x2="370" y2="120"/><line x1="410" y1="72" x2="410" y2="120"/>
  </g>
  <!-- pylons -->
  <rect x="212" y="70" width="36" height="70" fill="#c98b5e" stroke="#141118" stroke-width="3"/>
  <!-- border gate booths -->
  <g stroke="#141118" stroke-width="3">
    <rect x="196" y="140" width="30" height="44" fill="#1e63ff"/>
    <rect x="234" y="140" width="30" height="44" fill="#f5232b"/>
  </g>
  <!-- flags -->
  <g stroke="#141118" stroke-width="2.5">
    <line x1="214" y1="70" x2="214" y2="48"/><path d="M214 48 h18 v10 h-18 Z" fill="#e6117f"/>
    <line x1="246" y1="70" x2="246" y2="48"/><path d="M246 48 h18 v10 h-18 Z" fill="#ffd21e"/>
  </g>
</svg>
