<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" fill="none">
  <!-- Catedral / Misión de Guadalupe — Ciudad Juárez. Twin towers + dome. -->
  <g stroke="#141118" stroke-width="3" stroke-linejoin="round">
    <!-- towers -->
    <rect x="40" y="96" width="46" height="204" fill="#efe3cf"/>
    <rect x="234" y="96" width="46" height="204" fill="#efe3cf"/>
    <path d="M40 96 L63 58 L86 96 Z" fill="#e6117f"/>
    <path d="M234 96 L257 58 L280 96 Z" fill="#e6117f"/>
    <!-- nave -->
    <rect x="86" y="140" width="148" height="160" fill="#f6eedd"/>
    <!-- central dome -->
    <path d="M118 140 a42 42 0 0 1 84 0 Z" fill="#1e63ff"/>
    <line x1="160" y1="70" x2="160" y2="98" stroke-width="3"/>
    <line x1="150" y1="80" x2="170" y2="80" stroke-width="3"/>
    <!-- rose window + door -->
    <circle cx="160" cy="182" r="15" fill="#ffd21e"/>
    <path d="M142 300 v-58 a18 18 0 0 1 36 0 v58 Z" fill="#a9683f"/>
    <!-- tower bell openings -->
    <rect x="55" y="120" width="16" height="24" rx="8" fill="#a9683f"/>
    <rect x="249" y="120" width="16" height="24" rx="8" fill="#a9683f"/>
  </g>
</svg>
