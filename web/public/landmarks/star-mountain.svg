<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" fill="none">
  <!-- Franklin Mountains — El Paso. Layered adobe ridges with the illuminated Lone Star. -->
  <path d="M0 260 L70 150 L120 186 L190 96 L250 150 L320 110 L380 158 L420 132 L420 260 Z" fill="#a9683f" stroke="#141118" stroke-width="3" stroke-linejoin="round"/>
